name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-windows-x64:
    name: Format, Clippy, Test & Release Build (Windows x64)
    runs-on: windows-latest
    steps:
      # Keep version tags until full commit SHAs are verified in the remote repository.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run Clippy
        shell: pwsh
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit tests
        shell: pwsh
        run: cargo test --locked

      - name: Build release binaries
        shell: pwsh
        run: cargo build --release --locked --bin AirMonitor --bin airmonitor-probe

      - name: Enforce AirMonitor.exe binary size budget (< 2 MB)
        shell: pwsh
        run: |
          $maxBytes = 2 * 1024 * 1024
          $mainPath = "target/release/AirMonitor.exe"
          $probePath = "target/release/airmonitor-probe.exe"
          if (-not (Test-Path $mainPath)) {
            throw "Missing release binary: $mainPath"
          }
          if (-not (Test-Path $probePath)) {
            throw "Missing release binary: $probePath"
          }
          $mainSize = (Get-Item $mainPath).Length
          $probeSize = (Get-Item $probePath).Length
          Write-Host "AirMonitor.exe size: $mainSize bytes ($([math]::Round($mainSize / 1MB, 2)) MB)"
          Write-Host "airmonitor-probe.exe size: $probeSize bytes ($([math]::Round($probeSize / 1MB, 2)) MB)"
          if ($mainSize -ge $maxBytes) {
            throw "AirMonitor.exe ($mainSize bytes) exceeds 2 MB budget ($maxBytes bytes)"
          }
