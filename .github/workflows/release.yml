name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    name: Build & Verify Windows x64 Artifacts
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.verify_tag.outputs.tag }}
    steps:
      # Keep version tags until full commit SHAs are verified in the remote repository.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Verify strict semver tag matches Cargo.toml version
        id: verify_tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Release tag '$tag' does not match strict SemVer format (vMAJOR.MINOR.PATCH[-pre][+build])"
          }
          $tagVer = $tag.Substring(1)
          $cargoToml = Get-Content -Raw Cargo.toml
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $pkgVer = $Matches[1]
          } else {
            throw "Failed to parse version from Cargo.toml"
          }
          if ($tagVer -ne $pkgVer) {
            throw "Tag version ($tagVer) does not match Cargo.toml version ($pkgVer)"
          }
          Write-Host "Verified release version: $tag (Cargo.toml = $pkgVer)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run Clippy
        shell: pwsh
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit tests
        shell: pwsh
        run: cargo test --locked

      - name: Build release binaries
        shell: pwsh
        run: cargo build --release --locked --bin AirMonitor --bin airmonitor-probe

      - name: Stage artifacts, enforce size gate, and generate SHA256SUMS.txt
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.verify_tag.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $maxBytes = 2 * 1024 * 1024

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/AirMonitor.exe dist/AirMonitor.exe
          Copy-Item target/release/airmonitor-probe.exe dist/airmonitor-probe.exe

          $mainSize = (Get-Item dist/AirMonitor.exe).Length
          $probeSize = (Get-Item dist/airmonitor-probe.exe).Length
          if ($mainSize -ge $maxBytes) {
            throw "AirMonitor.exe ($mainSize bytes) exceeds 2 MB budget ($maxBytes bytes)"
          }

          $files = @("AirMonitor.exe", "airmonitor-probe.exe")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash (Join-Path dist $f) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $f"
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "dist/SHA256SUMS.txt"),
            (($lines -join "`n") + "`n"),
            $utf8NoBom
          )

          $mainMb = [math]::Round($mainSize / 1MB, 2)
          $probeMb = [math]::Round($probeSize / 1MB, 2)
          $shaTable = ($lines | ForEach-Object { "- ``$_``" }) -join "`n"

          $notesLines = @(
            "## AirMonitor $tag"
            ""
            "极致轻量化的 Windows 10 / Windows 11 原生任务栏硬件监控与无线外设电量监视器（Rust + Win32 + Direct2D，免驱动、免管理员权限、静态 CRT 零运行库依赖）。"
            ""
            "### 下载说明"
            "- **``AirMonitor.exe``**（约 $mainMb MB，$mainSize 字节）— 主程序，绿色单文件即开即用，支持任务栏浮条与系统托盘（日常使用仅下载此文件即可）。"
            "- **``airmonitor-probe.exe``**（约 $probeMb MB，$probeSize 字节）— 命令行硬件与无线 HID 诊断工具，用于排查设备数据源或适配新外设。"
            "- **``SHA256SUMS.txt``** — SHA-256 校验文件，供手动校验及应用内自动更新哈希完整性校验使用。"
            ""
            "### SHA-256 校验值"
            $shaTable
            ""
            "### 使用提示"
            "- 运行环境：Windows 10 / Windows 11（64 位），无需管理员权限。"
            "- 由于个人开源发行的二进制未购买商业代码签名证书，首次运行从 GitHub 下载的 ``AirMonitor.exe`` 时，Windows SmartScreen 可能会弹出「未知发布者」提示，点「更多信息 → 仍要运行」即可；您也可以核对上方 SHA-256 校验值或直接从源码自行编译。"
          )
          $notes = ($notesLines -join "`n") + "`n"

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "dist/RELEASE_NOTES.md"),
            $notes,
            $utf8NoBom
          )

          Get-Content dist/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/AirMonitor.exe
            dist/airmonitor-probe.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Keep version tags until full commit SHAs are verified in the remote repository.
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/AirMonitor.exe \
            dist/airmonitor-probe.exe \
            dist/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --title "AirMonitor $RELEASE_TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag
